name: Actualizar radar y publicar

on:
  schedule:
    - cron: "17 5 * * *"   # cada día ~06:17 hora de Canarias (05:17 UTC en invierno, 06:17 en verano)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths-ignore: ["data/auto.json", "data/watch.json", "data/nuevos.md"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests
        run: node --test test/update.test.mjs

      - name: Escanear BOE y vigilar páginas
        run: node scripts/update.mjs

      - name: Guardar cambios
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/auto.json data/watch.json
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%F)"
          git push || true

      - name: Avisar si hay novedades (abre un Issue; GitHub te notifica al móvil)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/nuevos.md ]; then
            gh issue create --title "Novedades oposiciones TIC · $(date -u +%F)" --body-file data/nuevos.md || true
          fi

      - uses: actions/configure-pages@v5

      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icon.svg icon-*.png data _site/
          rm -f _site/data/nuevos.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
