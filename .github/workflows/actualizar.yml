name: Actualizar radar y publicar

on:
  schedule:
    - cron: "17 5 * * *"   # cada día ~06:17 en Canarias (05:17 UTC en invierno)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [master]
    paths-ignore:
      - "data/auto.json"
      - "data/watch.json"
      - "data/salud.json"
      - "data/retribuciones.json"
      - "data/historico.json"
      - "data/seed-datos.json"
      - "data/festivos-oficiales.json"
      - "data/calendario.ics"
      - "data/nuevos.md"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Herramienta para leer PDF (tablas de retribuciones)
        run: which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Tests
        run: node --test test/update.test.mjs test/ejecutar.test.mjs test/automatico.test.mjs

      - name: Leer BOE, BOC, retribuciones y páginas oficiales
        run: node scripts/update.mjs

      - name: Guardar datos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/auto.json data/watch.json data/salud.json data/retribuciones.json data/historico.json data/seed-datos.json data/festivos-oficiales.json data/calendario.ics
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || true

      - name: Avisar si hay novedades (abre un Issue; GitHub Mobile te lo notifica)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/nuevos.md ]; then
            gh issue create --title "Novedades oposiciones TIC · $(date -u +%F)" --body-file data/nuevos.md || true
          fi

      - uses: actions/configure-pages@v5

      - name: Preparar sitio
        run: |
          mkdir -p _site/scripts
          cp index.html app.js app.css sw.js manifest.webmanifest icon.svg icon-*.png _site/
          cp -r scripts/lib _site/scripts/lib
          cp -r data _site/data
          rm -f _site/data/nuevos.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
