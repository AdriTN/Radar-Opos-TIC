<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Opos TIC</title>
<meta name="description" content="Convocatorias, plazos, bolsas y retribuciones de oposiciones de informática (AGE, Canarias, Gran Canaria), actualizado a diario.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar TIC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <nav class="side" id="side" aria-label="Navegación principal"></nav>
  <header class="bar">
    <button class="ibtn solo-movil" id="atras" aria-label="Volver" hidden></button>
    <h1 id="titulo">Radar Opos TIC</h1>
    <span class="sync" id="sync" role="status"></span>
    <button class="ibtn" id="refrescar" aria-label="Actualizar datos"></button>
  </header>
  <main id="vista" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Navegación principal"></nav>
</div>
<div class="sheet-wrap" id="sheetWrap" role="dialog" aria-modal="true" aria-label="Detalle">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
